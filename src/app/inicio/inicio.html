<div class="row mb-3">
  <div class="col-12 col-sm-6 col-md-8 mb-2">
    <input type="text" class="form-control" placeholder="Buscar película por nombre..." [(ngModel)]="texto">
  </div>
  <div class="col-12 col-sm-6 col-md-4 mb-2">
    <select class="form-select" [(ngModel)]="genero">
      <option value="todos">Todos los géneros</option>
      <option value="Drama">Drama</option>
      <option value="Ciencia ficción">Ciencia ficción</option>
      <option value="Animación">Animación</option>
      <option value="Thriller">Thriller</option>
    </select>
  </div>
</div>

<div class="row">
  @for (p of filtradas; track p.id) {
    <div class="col-12 col-sm-6 col-md-3 mb-4">
      <div class="card h-100 tarjeta" [routerLink]="['/pelicula', p.id]">
        <img [src]="p.imagen" class="card-img-top" alt="Portada de {{ p.titulo }}"
             (error)="$any($event.target).src = 'https://placehold.co/300x450/212529/ffffff?text=Sin+imagen'">
        <div class="card-body">
          <h5 class="card-title">{{ p.titulo }}</h5>
          <p class="card-text small text-muted mb-2">{{ p.fecha }}</p>
          <span class="badge bg-secondary">{{ p.genero }}</span>
          <span class="float-end">⭐ {{ p.calificacion }}</span>
        </div>
      </div>
    </div>
  } @empty {
    <p class="text-center text-muted">No se encontraron películas.</p>
  }
</div>
